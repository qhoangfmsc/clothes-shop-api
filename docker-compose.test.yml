# Postgres chỉ dành cho flow test (`yarn test:flows`). Mọi giá trị đọc từ `.env.test` ở root
# (mặc định cổng 55432 để không đụng DB dev ở 5432). Dữ liệu nằm trong tmpfs: tắt container là mất,
# mỗi lần chạy test dựng lại schema từ migration.
services:
  postgres-test:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DATABASE:-clothes_shop_test}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-test} -d ${POSTGRES_DATABASE:-clothes_shop_test}']
      interval: 2s
      timeout: 3s
      retries: 20
